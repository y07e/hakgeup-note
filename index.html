<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0891b2" />
  <meta name="description" content="학급 학생 관리 메모 앱 - 학급노트" />
  <title>학급노트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
  <style>
/* ===== Reset ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0891b2;--primary-dark:#0e7490;--primary-light:#ecfeff;
  --success:#16a34a;--success-light:#f0fdf4;
  --danger:#dc2626;--danger-light:#fef2f2;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;
  --text-sec:#64748b;--text-light:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 4px 20px rgba(0,0,0,.12);
  --max-w:420px;--header-h:56px;--tab-h:64px;
}
html,body{height:100%;background:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%}

/* ===== App Shell ===== */
.app{max-width:var(--max-w);margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:var(--shadow-lg)}

/* Header */
.header{height:var(--header-h);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.header-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:11px;opacity:.85;margin-top:1px}
.header-actions{display:flex;align-items:center;gap:8px}
.header-date{font-size:13px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px}
.header-date input[type="date"]{background:none;border:none;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;width:115px}
.header-date input::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:active{transform:scale(.95)}

/* Tab Bar */
.tabbar{height:var(--tab-h);background:var(--card);display:flex;border-top:1px solid var(--border);flex-shrink:0;z-index:10}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--text-light);font-size:11px;font-weight:600;cursor:pointer;transition:color .15s;font-family:inherit}
.tab-item.active{color:var(--primary)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:11px}

/* Main */
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}

/* Sub Tabs */
.sub-tabs{display:flex;margin:12px 16px 0;background:var(--border-light);border-radius:var(--radius);padding:3px}
.sub-tab{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;background:transparent;color:var(--text-sec)}
.sub-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Student Grid */
.student-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 16px}
.student-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;transition:all .15s;position:relative}
.student-cell:active{transform:scale(.96)}
.student-cell .s-num{font-size:11px;color:var(--text-light);line-height:1}
.student-cell .s-name{font-size:14px;font-weight:600;line-height:1.3}
.student-cell.selected{border-color:var(--primary);background:var(--primary-light)}
.student-cell.selected .s-name{color:var(--primary-dark)}
.student-cell .s-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--success)}

/* Section */
.section-title{font-size:13px;font-weight:700;color:var(--text-sec);margin-bottom:8px;padding-left:2px}

/* Tags */
.category-group{margin-bottom:12px}
.category-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.tag:active{transform:scale(.96)}
.tag.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:600}

/* Points */
.points-type-row{display:flex;gap:8px;margin-bottom:16px}
.points-type-btn{flex:1;padding:14px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;text-align:center}
.points-type-btn.reward{color:var(--success)}
.points-type-btn.penalty{color:var(--danger)}
.points-type-btn.reward.active{border-color:var(--success);background:var(--success-light)}
.points-type-btn.penalty.active{border-color:var(--danger);background:var(--danger-light)}
.points-counter{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px}
.counter-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:24px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.counter-btn:active{transform:scale(.9)}
.counter-value{font-size:36px;font-weight:800;min-width:60px;text-align:center}
.counter-value.reward{color:var(--success)}
.counter-value.penalty{color:var(--danger)}

/* Inputs */
.input-field{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--card);resize:none;transition:border-color .15s}
.input-field:focus{outline:none;border-color:var(--primary)}
.input-field::placeholder{color:var(--text-light)}
.input-row{display:flex;gap:8px;margin-bottom:8px}
.input-group{flex:1}
.input-label{font-size:13px;font-weight:600;color:var(--text-sec);margin-bottom:4px;display:block}

/* Buttons */
.btn-primary{width:100%;padding:16px;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;margin-top:8px}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:var(--border);color:var(--text-light);cursor:not-allowed}
.btn-secondary{width:100%;padding:14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-secondary:active{transform:scale(.98)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:30px;font-size:15px;font-weight:600;color:#fff;z-index:1000;animation:toastIn .3s ease,toastOut .3s ease 1.7s forwards;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:calc(var(--max-w) - 32px);text-align:center}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Lookup List */
.search-bar{margin:12px 16px}
.student-list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 16px 6px;background:var(--card);border-radius:var(--radius);cursor:pointer;transition:background .1s;box-shadow:var(--shadow)}
.student-list-item:active{background:var(--border-light)}
.sl-number{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sl-info{flex:1;min-width:0}
.sl-name{font-size:16px;font-weight:700}
.sl-meta{font-size:12px;color:var(--text-sec);margin-top:2px}
.sl-points{font-size:13px;font-weight:700;white-space:nowrap}
.sl-points.positive{color:var(--success)}
.sl-points.negative{color:var(--danger)}
.sl-arrow{color:var(--text-light);font-size:18px}

/* Detail */
.detail-header{display:flex;align-items:center;gap:12px;padding:16px}
.detail-back{width:40px;height:40px;border-radius:50%;border:none;background:var(--border-light);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.detail-back:active{transform:scale(.9)}
.detail-name{font-size:22px;font-weight:800}
.detail-stats{display:flex;gap:8px;padding:0 16px 16px}
.stat-card{flex:1;padding:12px;background:var(--card);border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:22px;font-weight:800}
.stat-label{font-size:11px;color:var(--text-sec);margin-top:2px}

/* Timeline */
.timeline-item{margin:0 16px 8px;padding:12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.timeline-item-header{display:flex;justify-content:space-between;align-items:flex-start}
.timeline-date{font-size:12px;color:var(--text-light);margin-bottom:4px}
.timeline-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.timeline-tag{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:600}
.timeline-tag.memo{background:var(--primary-light);color:var(--primary-dark)}
.timeline-tag.reward{background:var(--success-light);color:var(--success)}
.timeline-tag.penalty{background:var(--danger-light);color:var(--danger)}
.timeline-text{font-size:14px;color:var(--text-sec);line-height:1.4}
.delete-record-btn{background:none;border:none;color:var(--text-light);font-size:16px;cursor:pointer;padding:2px;line-height:1}
.delete-record-btn:hover{color:var(--danger)}

/* Progress */
.progress-form{padding:16px}
.progress-card{margin:0 16px 8px;padding:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.progress-period{display:inline-block;background:var(--primary-light);color:var(--primary-dark);font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:4px}
.progress-unit{font-size:15px;font-weight:700;margin-bottom:2px}
.progress-content{font-size:14px;color:var(--text-sec);line-height:1.4}
.progress-date{font-size:11px;color:var(--text-light);margin-top:4px}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:var(--max-w);max-height:85vh;background:var(--bg);border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--border-light);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-label{font-size:13px;font-weight:700;color:var(--text-sec);margin-bottom:8px}
.settings-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--card);color:var(--text);margin-bottom:8px}
.settings-input:focus{outline:none;border-color:var(--primary)}
.student-manage-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.sm-num{font-size:13px;color:var(--text-light);width:24px;text-align:center;flex-shrink:0}
.sm-name{flex:1;font-size:15px;font-weight:600}
.sm-delete{width:32px;height:32px;border-radius:50%;border:none;background:var(--danger-light);color:var(--danger);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-student-row{display:flex;gap:8px;margin-top:8px}
.add-student-row input{flex:1}
.add-btn{padding:10px 16px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.add-btn:active{transform:scale(.96)}
.bulk-textarea{width:100%;min-height:100px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:8px}
.bulk-textarea:focus{outline:none;border-color:var(--primary)}

/* Misc */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;line-height:1.5}
.hint{font-size:12px;color:var(--text-light);padding:4px 0 8px;display:flex;align-items:center;gap:4px}
.confirm-bar{display:flex;gap:8px;margin-top:6px}
.confirm-bar button{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.confirm-yes{background:var(--danger);color:#fff}
.confirm-no{background:var(--border-light);color:var(--text)}
.divider{height:1px;background:var(--border);margin:16px 0}

@media(min-width:480px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
@media(max-width:360px){.student-grid{grid-template-columns:repeat(4,1fr)}.student-cell{height:52px}.student-cell .s-name{font-size:13px}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>

  <script>
// ===== Setup =====
const { useState, useEffect, useCallback, useRef } = React;
const html = htm.bind(React.createElement);

// ===== Constants =====
const MEMO_CATEGORIES = {
  '출결': ['생리결석', '병결', '무단결석', '지각', '조퇴', '결과'],
  '상담·관계': ['학부모상담', '학생상담', '교우관계'],
  '생활·학습': ['보건', '생활지도', '학습', '칭찬'],
  '기타': ['진로', '가정연락', '기타'],
};
const REWARD_REASONS = ['선행', '봉사', '청소', '도움', '모범', '발표', '성적우수', '출석우수'];
const PENALTY_REASONS = ['지각', '결석', '수업태도', '폭력', '기물파손', '흡연', '기타위반'];

// ===== Utilities =====
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => { const p = s.split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; };

// ===== Store =====
const KEYS = { classInfo:'hn_ci', students:'hn_st', memos:'hn_me', points:'hn_pt', progress:'hn_pr' };
const load = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch(e) { return fb; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

const loadCI = () => load(KEYS.classInfo, { schoolName:'', teacherName:'', className:'담임반' });
const loadSt = () => load(KEYS.students, []);
const loadMe = () => load(KEYS.memos, []);
const loadPt = () => load(KEYS.points, []);
const loadPr = () => load(KEYS.progress, []);

// ===== StudentGrid =====
function StudentGrid({ students, selectedId, onSelect, memos, today }) {
  const todaySet = new Set(memos.filter(function(m){ return m.date === today; }).map(function(m){ return m.studentId; }));
  return html`
    <div className="student-grid">
      ${students.map(function(s) { return html`
        <button key=${s.id}
          className=${'student-cell' + (selectedId === s.id ? ' selected' : '')}
          onClick=${function(){ onSelect(s.id); }}>
          ${todaySet.has(s.id) && html`<span className="s-dot" />`}
          <span className="s-num">${s.number}</span>
          <span className="s-name">${s.name}</span>
        </button>
      `; })}
    </div>
  `;
}

// ===== InputTab =====
function InputTab({ students, memos, points, date, onSaveMemo, onSavePoint, onToast }) {
  const [mode, setMode] = useState('memo');
  const [selSt, setSelSt] = useState(null);
  const [selCats, setSelCats] = useState([]);
  const [memoText, setMemoText] = useState('');
  const [ptType, setPtType] = useState('reward');
  const [ptVal, setPtVal] = useState(1);
  const [selReasons, setSelReasons] = useState([]);
  const [addReason, setAddReason] = useState('');

  const selName = (students.find(function(s){ return s.id === selSt; }) || {}).name;

  var toggleCat = function(c) { setSelCats(function(p){ return p.includes(c) ? p.filter(function(x){return x!==c;}) : p.concat([c]); }); };
  var toggleReason = function(r) { setSelReasons(function(p){ return p.includes(r) ? p.filter(function(x){return x!==r;}) : p.concat([r]); }); };

  var saveMemo = function() {
    if (!selSt) { onToast('학생을 선택하세요', 'error'); return; }
    if (!selCats.length && !memoText.trim()) { onToast('카테고리 또는 메모를 입력하세요', 'error'); return; }
    onSaveMemo({ id: uid(), studentId: selSt, date: date, categories: selCats.slice(), memo: memoText.trim(), createdAt: new Date().toISOString() });
    onToast(selName + ' - 메모 저장 완료');
    setSelSt(null); setSelCats([]); setMemoText('');
  };

  var savePoint = function() {
    if (!selSt) { onToast('학생을 선택하세요', 'error'); return; }
    if (!selReasons.length && !addReason.trim()) { onToast('사유를 선택하세요', 'error'); return; }
    onSavePoint({ id: uid(), studentId: selSt, date: date, type: ptType, points: ptVal, reasons: selReasons.slice(), additionalReason: addReason.trim(), createdAt: new Date().toISOString() });
    var label = ptType === 'reward' ? '상점' : '벌점';
    onToast(selName + ' - ' + label + ' ' + ptVal + '점 저장');
    setSelSt(null); setSelReasons([]); setAddReason(''); setPtVal(1);
  };

  if (!students.length) return html`
    <div className="empty-state">
      <div className="empty-icon">👋</div>
      <div className="empty-text">학생 명단을 먼저 등록해주세요.<br/>오른쪽 상단 ⚙ 버튼을 눌러<br/>설정에서 학생을 추가할 수 있습니다.</div>
    </div>`;

  return html`
    <div>
    <div className="sub-tabs">
      <button className=${'sub-tab' + (mode==='memo'?' active':'')} onClick=${function(){setMode('memo');}}>메모 기록</button>
      <button className=${'sub-tab' + (mode==='points'?' active':'')} onClick=${function(){setMode('points');}}>상벌점</button>
    </div>

    <div style=${{padding:'8px 16px 0'}}>
      <div className="section-title">학생 선택 ${selName ? html` <span style=${{color:'var(--primary)'}}>— ${selName}</span>` : null}</div>
    </div>
    <${StudentGrid} students=${students} selectedId=${selSt} onSelect=${setSelSt} memos=${memos} today=${todayStr()} />

    ${mode === 'memo' ? html`
      <div style=${{padding:'0 16px 16px'}}>
        <div className="section-title">카테고리 선택</div>
        ${Object.keys(MEMO_CATEGORIES).map(function(g) { var cats = MEMO_CATEGORIES[g]; return html`
          <div className="category-group" key=${g}>
            <div className="category-label">${g}</div>
            <div className="tag-row">
              ${cats.map(function(c) { return html`<button key=${c} className=${'tag' + (selCats.includes(c)?' selected':'')} onClick=${function(){toggleCat(c);}}>${c}</button>`; })}
            </div>
          </div>
        `; })}
        <div className="section-title" style=${{marginTop:8}}>메모 (선택)</div>
        <textarea className="input-field" rows="2" placeholder="추가 메모가 있으면 입력하세요..."
          value=${memoText} onInput=${function(e){setMemoText(e.target.value);}} />
        <div className="hint">💡 카테고리만 선택해도 바로 저장할 수 있어요</div>
        <button className="btn-primary" onClick=${saveMemo}>저장하기</button>
      </div>
    ` : html`
      <div style=${{padding:'0 16px 16px'}}>
        <div className="section-title">유형</div>
        <div className="points-type-row">
          <button className=${'points-type-btn reward' + (ptType==='reward'?' active':'')} onClick=${function(){setPtType('reward');}}>👍 상점</button>
          <button className=${'points-type-btn penalty' + (ptType==='penalty'?' active':'')} onClick=${function(){setPtType('penalty');}}>👎 벌점</button>
        </div>
        <div className="section-title">점수</div>
        <div className="points-counter">
          <button className="counter-btn" onClick=${function(){setPtVal(Math.max(1,ptVal-1));}}>−</button>
          <span className=${'counter-value ' + ptType}>+${ptVal}</span>
          <button className="counter-btn" onClick=${function(){setPtVal(Math.min(10,ptVal+1));}}>+</button>
        </div>
        <div className="section-title">사유 선택</div>
        <div className="tag-row" style=${{marginBottom:12}}>
          ${(ptType==='reward'?REWARD_REASONS:PENALTY_REASONS).map(function(r) { return html`
            <button key=${r} className=${'tag' + (selReasons.includes(r)?' selected':'')} onClick=${function(){toggleReason(r);}}>${r}</button>
          `; })}
        </div>
        <div className="section-title">추가 사유 (선택)</div>
        <input className="input-field" placeholder="추가 사유가 있으면 입력하세요..."
          value=${addReason} onInput=${function(e){setAddReason(e.target.value);}} />
        <button className="btn-primary" style=${{marginTop:12}} onClick=${savePoint}>저장하기</button>
      </div>
    `}
  </div>`;
}

// ===== ProgressTab =====
function ProgressTab({ progress, date, onSave, onDelete, onToast }) {
  const [period, setPeriod] = useState(1);
  const [unit, setUnit] = useState('');
  const [content, setContent] = useState('');
  const [note, setNote] = useState('');
  const [delId, setDelId] = useState(null);

  var doSave = function() {
    if (!content.trim()) { onToast('학습 내용을 입력하세요', 'error'); return; }
    onSave({ id: uid(), date: date, period: period, unit: unit.trim(), content: content.trim(), note: note.trim(), createdAt: new Date().toISOString() });
    onToast('진도 기록 저장 완료');
    setPeriod(function(p){return p+1;}); setUnit(''); setContent(''); setNote('');
  };

  var sorted = progress.slice().sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); });

  return html`<div>
    <div className="progress-form">
      <div className="section-title" style=${{marginBottom:12}}>새 진도 기록</div>
      <div className="input-row">
        <div className="input-group" style=${{flex:'0 0 80px'}}>
          <label className="input-label">차시</label>
          <input className="input-field" type="number" min="1" value=${period} onInput=${function(e){setPeriod(Number(e.target.value)||1);}} />
        </div>
        <div className="input-group">
          <label className="input-label">단원</label>
          <input className="input-field" placeholder="단원명" value=${unit} onInput=${function(e){setUnit(e.target.value);}} />
        </div>
      </div>
      <div style=${{marginBottom:8}}>
        <label className="input-label">학습내용</label>
        <textarea className="input-field" rows="2" placeholder="오늘 수업 내용을 간단히 기록하세요."
          value=${content} onInput=${function(e){setContent(e.target.value);}} />
      </div>
      <div style=${{marginBottom:8}}>
        <label className="input-label">비고 (선택)</label>
        <input className="input-field" placeholder="준비물, 과제, 특이사항 등" value=${note} onInput=${function(e){setNote(e.target.value);}} />
      </div>
      <button className="btn-primary" onClick=${doSave}>진도 저장</button>
    </div>

    <div style=${{padding:'0 0 16px'}}>
      <div className="section-title" style=${{padding:'0 16px 8px'}}>진도 기록</div>
      ${sorted.length === 0
        ? html`<div className="empty-state" style=${{padding:'24px 20px'}}><div className="empty-text">아직 진도 기록이 없습니다</div></div>`
        : sorted.map(function(p) { return html`
          <div className="progress-card" key=${p.id}>
            <div className="timeline-item-header">
              <div>
                <span className="progress-period">${p.period}차시</span>
                ${p.unit ? html`<span className="progress-unit" style=${{marginLeft:8}}>${p.unit}</span>` : null}
              </div>
              <button className="delete-record-btn" onClick=${function(){setDelId(delId===p.id?null:p.id);}}>✕</button>
            </div>
            <div className="progress-content">${p.content}</div>
            ${p.note ? html`<div className="progress-content" style=${{fontStyle:'italic'}}>📌 ${p.note}</div>` : null}
            <div className="progress-date">${fmtDate(p.date)}</div>
            ${delId===p.id ? html`
              <div className="confirm-bar">
                <button className="confirm-yes" onClick=${function(){onDelete(p.id);setDelId(null);onToast('삭제 완료');}}>삭제</button>
                <button className="confirm-no" onClick=${function(){setDelId(null);}}>취소</button>
              </div>` : null}
          </div>
        `; })
      }
    </div>
  </div>`;
}

// ===== StudentDetail =====
function StudentDetail({ student, memos, points, onBack, onDeleteMemo, onDeletePoint, onToast }) {
  const [delId, setDelId] = useState(null);
  var sMemos = memos.filter(function(m){ return m.studentId === student.id; });
  var sPoints = points.filter(function(p){ return p.studentId === student.id; });
  var totalR = sPoints.filter(function(p){return p.type==='reward';}).reduce(function(s,p){return s+p.points;},0);
  var totalP = sPoints.filter(function(p){return p.type==='penalty';}).reduce(function(s,p){return s+p.points;},0);

  var timeline = sMemos.map(function(m){ return {id:m.id,date:m.date,ca:m.createdAt,type:'memo',rec:m}; })
    .concat(sPoints.map(function(p){ return {id:p.id,date:p.date,ca:p.createdAt,type:'point',rec:p}; }))
    .sort(function(a,b){ return b.ca.localeCompare(a.ca); });

  var doDelete = function(e) {
    if (e.type === 'memo') onDeleteMemo(e.id); else onDeletePoint(e.id);
    setDelId(null); onToast('삭제 완료');
  };

  return html`<div>
    <div className="detail-header">
      <button className="detail-back" onClick=${onBack}>←</button>
      <div>
        <div className="detail-name">${student.name}</div>
        <div style=${{fontSize:13,color:'var(--text-sec)'}}>${student.number}번</div>
      </div>
    </div>

    <div className="detail-stats">
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--primary)'}}>${sMemos.length}</div><div className="stat-label">메모</div></div>
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--success)'}}>${totalR}</div><div className="stat-label">상점</div></div>
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--danger)'}}>${totalP}</div><div className="stat-label">벌점</div></div>
    </div>

    <div className="section-title" style=${{padding:'0 16px 8px'}}>전체 기록 (${timeline.length}건)</div>

    ${timeline.length === 0
      ? html`<div className="empty-state" style=${{padding:24}}><div className="empty-text">기록이 없습니다</div></div>`
      : timeline.map(function(e) { return html`
        <div className="timeline-item" key=${e.id}>
          <div className="timeline-item-header">
            <div className="timeline-date">${fmtDate(e.date)}</div>
            <button className="delete-record-btn" onClick=${function(){setDelId(delId===e.id?null:e.id);}}>✕</button>
          </div>
          ${e.type === 'memo' ? html`
            <div className="timeline-tags">
              ${e.rec.categories.map(function(c){ return html`<span key=${c} className="timeline-tag memo">${c}</span>`; })}
            </div>
            ${e.rec.memo ? html`<div className="timeline-text">${e.rec.memo}</div>` : null}
          ` : html`
            <div className="timeline-tags">
              <span className=${'timeline-tag ' + e.rec.type}>${e.rec.type==='reward'?'상점':'벌점'} +${e.rec.points}</span>
              ${e.rec.reasons.map(function(r){ return html`<span key=${r} className=${'timeline-tag ' + e.rec.type}>${r}</span>`; })}
            </div>
            ${e.rec.additionalReason ? html`<div className="timeline-text">${e.rec.additionalReason}</div>` : null}
          `}
          ${delId===e.id ? html`
            <div className="confirm-bar">
              <button className="confirm-yes" onClick=${function(){doDelete(e);}}>삭제</button>
              <button className="confirm-no" onClick=${function(){setDelId(null);}}>취소</button>
            </div>` : null}
        </div>
      `; })
    }
  </div>`;
}

// ===== LookupTab =====
function LookupTab({ students, memos, points, onDeleteMemo, onDeletePoint, onToast }) {
  const [search, setSearch] = useState('');
  const [selStudent, setSelStudent] = useState(null);

  if (selStudent) return html`<${StudentDetail}
    student=${selStudent} memos=${memos} points=${points}
    onBack=${function(){setSelStudent(null);}} onDeleteMemo=${onDeleteMemo} onDeletePoint=${onDeletePoint} onToast=${onToast} />`;

  var filtered = students.filter(function(s){ return s.name.includes(search) || String(s.number).includes(search); });

  var getNet = function(sid) {
    var sp = points.filter(function(p){return p.studentId===sid;});
    return sp.filter(function(p){return p.type==='reward';}).reduce(function(s,p){return s+p.points;},0)
         - sp.filter(function(p){return p.type==='penalty';}).reduce(function(s,p){return s+p.points;},0);
  };
  var getMemoCnt = function(sid) { return memos.filter(function(m){return m.studentId===sid;}).length; };

  if (!students.length) return html`<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">등록된 학생이 없습니다</div></div>`;

  return html`<div>
    <div className="search-bar">
      <input className="input-field" placeholder="🔍 학생 이름 검색..." value=${search} onInput=${function(e){setSearch(e.target.value);}} />
    </div>
    ${filtered.map(function(s) {
      var net = getNet(s.id);
      var cnt = getMemoCnt(s.id);
      return html`
        <div key=${s.id} className="student-list-item" onClick=${function(){setSelStudent(s);}}>
          <div className="sl-number">${s.number}</div>
          <div className="sl-info">
            <div className="sl-name">${s.name}</div>
            <div className="sl-meta">메모 ${cnt}건</div>
          </div>
          ${net !== 0 ? html`<div className=${'sl-points ' + (net>0?'positive':'negative')}>${net>0?'상점 +'+net:'벌점 '+net}</div>` : null}
          <div className="sl-arrow">›</div>
        </div>`;
    })}
  </div>`;
}

// ===== Settings =====
function Settings({ classInfo, students, onUpdateCI, onUpdateSt, onClose, onToast, onReload }) {
  const [sn, setSn] = useState(classInfo.schoolName);
  const [tn, setTn] = useState(classInfo.teacherName);
  const [cn, setCn] = useState(classInfo.className);
  const [newName, setNewName] = useState('');
  const [bulk, setBulk] = useState('');
  const [showBulk, setShowBulk] = useState(false);
  const [delConfirm, setDelConfirm] = useState(null);
  const fileRef = useRef(null);

  var saveCI = function() {
    onUpdateCI({ schoolName: sn.trim(), teacherName: tn.trim(), className: cn.trim() || '담임반' });
    onToast('학급 정보 저장 완료');
  };

  var addOne = function() {
    var name = newName.trim();
    if (!name) return;
    var maxN = students.length > 0 ? Math.max.apply(null, students.map(function(s){return s.number;})) : 0;
    onUpdateSt(students.concat([{ id: uid(), number: maxN+1, name: name }]));
    setNewName('');
    onToast(name + ' 학생 추가 완료');
  };

  var addBulkFn = function() {
    var names = bulk.split('\n').map(function(n){return n.trim();}).filter(function(n){return n.length>0;});
    if (!names.length) return;
    var maxN = students.length > 0 ? Math.max.apply(null, students.map(function(s){return s.number;})) : 0;
    var news = names.map(function(name, i) { return { id: uid(), number: maxN+1+i, name: name }; });
    onUpdateSt(students.concat(news));
    setBulk(''); setShowBulk(false);
    onToast(names.length + '명 학생 일괄 추가 완료');
  };

  var delStudent = function(id) {
    onUpdateSt(students.filter(function(s){return s.id !== id;}));
    setDelConfirm(null); onToast('학생 삭제 완료');
  };

  var doExport = function() {
    var data = JSON.stringify({
      version: 1, exportedAt: new Date().toISOString(),
      classInfo: load(KEYS.classInfo, {}), students: load(KEYS.students, []),
      memos: load(KEYS.memos, []), points: load(KEYS.points, []), progress: load(KEYS.progress, []),
    }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '학급노트_백업_' + todayStr() + '.json'; a.click();
    URL.revokeObjectURL(url);
    onToast('백업 파일 다운로드 완료');
  };

  var doImport = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var d = JSON.parse(reader.result);
        if (d.classInfo) save(KEYS.classInfo, d.classInfo);
        if (d.students) save(KEYS.students, d.students);
        if (d.memos) save(KEYS.memos, d.memos);
        if (d.points) save(KEYS.points, d.points);
        if (d.progress) save(KEYS.progress, d.progress);
        onToast('데이터 복원 완료'); onReload(); onClose();
      } catch(err) { onToast('파일 형식이 올바르지 않습니다', 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return html`
    <div className="modal-overlay" onClick=${onClose}>
      <div className="modal" onClick=${function(e){e.stopPropagation();}}>
        <div className="modal-header">
          <div className="modal-title">설정</div>
          <button className="modal-close" onClick=${onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="settings-section">
            <div className="settings-label">학급 정보</div>
            <input className="settings-input" placeholder="학교 이름" value=${sn} onInput=${function(e){setSn(e.target.value);}} />
            <input className="settings-input" placeholder="선생님 이름" value=${tn} onInput=${function(e){setTn(e.target.value);}} />
            <input className="settings-input" placeholder="반 이름 (예: 1학년 3반)" value=${cn} onInput=${function(e){setCn(e.target.value);}} />
            <button className="btn-primary" style=${{marginTop:0}} onClick=${saveCI}>학급 정보 저장</button>
          </div>

          <div className="divider" />

          <div className="settings-section">
            <div className="settings-label">학생 명단 (${students.length}명)</div>
            ${students.map(function(s) { return html`
              <div key=${s.id} className="student-manage-item">
                <span className="sm-num">${s.number}</span>
                <span className="sm-name">${s.name}</span>
                ${delConfirm===s.id
                  ? html`<div className="confirm-bar">
                      <button className="confirm-yes" onClick=${function(){delStudent(s.id);}}>삭제</button>
                      <button className="confirm-no" onClick=${function(){setDelConfirm(null);}}>취소</button>
                    </div>`
                  : html`<button className="sm-delete" onClick=${function(){setDelConfirm(s.id);}}>✕</button>`
                }
              </div>
            `; })}
            <div className="add-student-row">
              <input className="settings-input" style=${{marginBottom:0}} placeholder="학생 이름"
                value=${newName} onInput=${function(e){setNewName(e.target.value);}}
                onKeyDown=${function(e){if(e.key==='Enter')addOne();}} />
              <button className="add-btn" onClick=${addOne}>추가</button>
            </div>
            <button className="btn-secondary" style=${{marginTop:8}} onClick=${function(){setShowBulk(!showBulk);}}>
              ${showBulk ? '접기' : '📋 일괄 등록'}
            </button>
            ${showBulk ? html`
              <div style=${{marginTop:8}}>
                <textarea className="bulk-textarea" placeholder=${'이름을 한 줄에 하나씩 입력하세요.\n\n예시:\n홍길동\n김철수\n이영희'}
                  value=${bulk} onInput=${function(e){setBulk(e.target.value);}} />
                <button className="btn-primary" onClick=${addBulkFn}>일괄 추가</button>
              </div>
            ` : null}
          </div>

          <div className="divider" />

          <div className="settings-section">
            <div className="settings-label">데이터 관리</div>
            <button className="btn-secondary" style=${{marginBottom:8}} onClick=${doExport}>💾 데이터 백업 (JSON 다운로드)</button>
            <button className="btn-secondary" onClick=${function(){fileRef.current && fileRef.current.click();}}>📂 데이터 복원 (JSON 불러오기)</button>
            <input ref=${fileRef} type="file" accept=".json" style=${{display:'none'}} onChange=${doImport} />
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== App =====
function App() {
  const [ci, setCi] = useState(loadCI);
  const [students, setStudents] = useState(loadSt);
  const [memos, setMemos] = useState(loadMe);
  const [points, setPoints] = useState(loadPt);
  const [progress, setProgress] = useState(loadPr);
  const [tab, setTab] = useState('input');
  const [date, setDate] = useState(todayStr());
  const [showSettings, setShowSettings] = useState(false);
  const [toasts, setToasts] = useState([]);

  useEffect(function(){ save(KEYS.classInfo, ci); }, [ci]);
  useEffect(function(){ save(KEYS.students, students); }, [students]);
  useEffect(function(){ save(KEYS.memos, memos); }, [memos]);
  useEffect(function(){ save(KEYS.points, points); }, [points]);
  useEffect(function(){ save(KEYS.progress, progress); }, [progress]);

  var toast = useCallback(function(msg, type) {
    var id = Date.now();
    setToasts(function(p){ return p.concat([{ id: id, msg: msg, type: type || 'success' }]); });
    setTimeout(function(){ setToasts(function(p){ return p.filter(function(t){return t.id !== id;}); }); }, 2200);
  }, []);

  var reload = useCallback(function() {
    setCi(loadCI()); setStudents(loadSt()); setMemos(loadMe()); setPoints(loadPt()); setProgress(loadPr());
  }, []);

  var title = ci.schoolName || '학급노트';
  var sub = [ci.className, ci.teacherName].filter(Boolean).join(' · ');

  return html`
    <div className="app">
      <header className="header">
        <div>
          <div className="header-title">${title}</div>
          ${sub ? html`<div className="header-sub">${sub}</div>` : null}
        </div>
        <div className="header-actions">
          <div className="header-date">
            <input type="date" value=${date} onChange=${function(e){setDate(e.target.value);}} />
          </div>
          <button className="icon-btn" onClick=${function(){setShowSettings(true);}} title="설정">⚙</button>
        </div>
      </header>

      <main className="main-content">
        ${tab === 'input' ? html`<${InputTab}
          students=${students} memos=${memos} points=${points} date=${date}
          onSaveMemo=${function(m){setMemos(function(p){return p.concat([m]);});}}
          onSavePoint=${function(p){setPoints(function(pp){return pp.concat([p]);});}}
          onToast=${toast} />` : null}
        ${tab === 'progress' ? html`<${ProgressTab}
          progress=${progress} date=${date}
          onSave=${function(p){setProgress(function(pp){return pp.concat([p]);});}}
          onDelete=${function(id){setProgress(function(p){return p.filter(function(x){return x.id!==id;});});}}
          onToast=${toast} />` : null}
        ${tab === 'lookup' ? html`<${LookupTab}
          students=${students} memos=${memos} points=${points}
          onDeleteMemo=${function(id){setMemos(function(p){return p.filter(function(m){return m.id!==id;});});}}
          onDeletePoint=${function(id){setPoints(function(p){return p.filter(function(x){return x.id!==id;});});}}
          onToast=${toast} />` : null}
      </main>

      <nav className="tabbar">
        <button className=${'tab-item' + (tab==='input'?' active':'')} onClick=${function(){setTab('input');}}>
          <span className="tab-icon">✏️</span><span className="tab-label">입력</span>
        </button>
        <button className=${'tab-item' + (tab==='progress'?' active':'')} onClick=${function(){setTab('progress');}}>
          <span className="tab-icon">📖</span><span className="tab-label">진도</span>
        </button>
        <button className=${'tab-item' + (tab==='lookup'?' active':'')} onClick=${function(){setTab('lookup');}}>
          <span className="tab-icon">🔍</span><span className="tab-label">조회</span>
        </button>
      </nav>

      ${showSettings ? html`<${Settings}
        classInfo=${ci} students=${students}
        onUpdateCI=${setCi} onUpdateSt=${setStudents}
        onClose=${function(){setShowSettings(false);}} onToast=${toast} onReload=${reload} />` : null}

      ${toasts.map(function(t){ return html`<div key=${t.id} className=${'toast ' + t.type}>${t.msg}</div>`; })}
    </div>
  `;
}

// ===== Mount =====
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
