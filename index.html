<html lang="ko">

  <meta name="description" content="학급 학생 관리 메모 앱 - 학급노트" />
  <title>학급노트</title>

  <style>
@font-face{font-family:'A2GBold';src:url('a2z-bold.ttf') format('truetype');font-weight:bold;font-style:normal}
/* ===== Reset ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0891b2;--primary-dark:#0e7490;--primary-light:#ecfeff;
  --success:#16a34a;--success-light:#f0fdf4;
  --danger:#dc2626;--danger-light:#fef2f2;
  --warning:#f59e0b;--warning-light:#fffbeb;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;
  --text-sec:#64748b;--text-light:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 4px 20px rgba(0,0,0,.12);
  --max-w:480px;--header-h:56px;--tab-h:64px;
}
html,body{height:100%;background:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%}

/* ===== App Shell ===== */
.app{max-width:var(--max-w);margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:var(--shadow-lg)}

/* Top Title Bar */
.top-title-bar{background:var(--primary-dark);color:#fff;text-align:center;padding:6px 16px;font-size:13px;font-weight:700;letter-spacing:.5px;flex-shrink:0}

/* Footer */
.footer-bar{background:var(--primary-dark);color:rgba(255,255,255,.6);text-align:center;padding:6px 16px;font-size:10px;flex-shrink:0;letter-spacing:.3px}

/* Header */
.header{height:var(--header-h);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.header-left>div{min-width:0;overflow:hidden}
.header-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4);flex-shrink:0}
.header-title{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:13px;font-weight:600;opacity:.95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.header-date{font-size:14px;background:rgba(255,255,255,.25);padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;-webkit-user-select:none;user-select:none}
.header-date-text{font-size:14px;font-weight:600;white-space:nowrap;color:#fff}
.header-date-icon{font-size:16px;line-height:1;flex-shrink:0}
.dp-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99}
.dp-drop{position:absolute;top:calc(100% + 8px);right:-8px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:16px;z-index:100;width:280px;color:#0f172a;-webkit-user-select:none;user-select:none}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-title{font-size:15px;font-weight:700}
.dp-nav{width:30px;height:30px;border:none;background:#f1f5f9;border-radius:50%;cursor:pointer;font-size:13px;color:#64748b;display:flex;align-items:center;justify-content:center;font-family:inherit}
.dp-nav:hover{background:#e2e8f0}
.dp-weeks{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:2px}
.dp-weeks span{padding:4px 0}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{width:34px;height:34px;border:none;background:none;border-radius:50%;cursor:pointer;font-size:13px;color:#334155;display:flex;align-items:center;justify-content:center;margin:0 auto;font-family:inherit;transition:background .1s}
.dp-day:hover{background:#f1f5f9}
.dp-day.today{background:#ecfeff;color:#0891b2;font-weight:700}
.dp-day.sel{background:#0891b2;color:#fff;font-weight:700}
.dp-day.sel:hover{background:#0e7490}
.dp-day.other{color:#cbd5e1;cursor:default}
.dp-day.other:hover{background:none}
.dp-today-btn{width:100%;margin-top:10px;padding:7px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;color:#0891b2;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.dp-today-btn:hover{background:#ecfeff}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:active{transform:scale(.95)}
.setting-btn{width:auto;height:auto;border-radius:8px;flex-direction:column;gap:1px;padding:4px 8px;font-size:16px}
.setting-label{font-size:9px;font-weight:800;letter-spacing:-.2px;opacity:1}

/* Narrow screen (Galaxy Fold etc.) */
@media(max-width:380px){
.header{padding:0 10px}
.header-left{gap:6px}
.header-logo{width:30px;height:30px}
.header-title{font-size:14px}
.header-sub{font-size:11px}
.header-actions{gap:4px}
.header-date{padding:4px 8px;gap:4px}
.header-date-text{font-size:12px}
.header-date-icon{font-size:13px}
.setting-btn{padding:3px 5px;font-size:14px}
.setting-label{display:none}
.dp-drop{right:-4px;width:260px;padding:12px}
.dp-day{width:30px;height:30px;font-size:12px}
}

/* Tab Bar */
.tabbar{height:var(--tab-h);background:var(--card);display:flex;border-top:1px solid var(--border);flex-shrink:0;z-index:10}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--text-light);font-size:11px;font-weight:600;cursor:pointer;transition:color .15s;font-family:inherit}
.tab-item.active{color:var(--primary)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:9px}
@media(max-width:380px){.tab-icon{font-size:18px}.tab-label{font-size:8px}.tab-item{gap:1px}}

/* Main */
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}

/* Sub Tabs */
.sub-tabs{display:flex;margin:12px 16px 0;background:var(--border-light);border-radius:var(--radius);padding:3px}
.sub-tab{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;background:transparent;color:var(--text-sec)}
.sub-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Student Grid */
.student-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 16px}
.student-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;transition:all .15s;position:relative}
.student-cell:active{transform:scale(.96)}
.student-cell .s-num{font-size:11px;color:var(--text-light);line-height:1}
.student-cell .s-name{font-size:14px;font-weight:600;line-height:1.3}
.student-cell.selected{border-color:var(--primary);background:var(--primary-light)}
.student-cell.selected .s-name{color:var(--primary-dark)}
.student-cell .s-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--success)}

/* Section */
.section-title{font-size:13px;font-weight:700;color:var(--text-sec);margin-bottom:8px;padding-left:2px}

/* Tags */
.category-group{margin-bottom:12px}
.category-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.tag:active{transform:scale(.96)}
.tag.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:600}

/* Points */
.points-type-row{display:flex;gap:8px;margin-bottom:16px}
.points-type-btn{flex:1;padding:14px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;text-align:center}
.points-type-btn.reward{color:var(--success)}
.points-type-btn.penalty{color:var(--danger)}
.points-type-btn.reward.active{border-color:var(--success);background:var(--success-light)}
.points-type-btn.penalty.active{border-color:var(--danger);background:var(--danger-light)}
.points-counter{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px}
.counter-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:24px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.counter-btn:active{transform:scale(.9)}
.counter-value{font-size:36px;font-weight:800;min-width:60px;text-align:center}
.counter-value.reward{color:var(--success)}
.counter-value.penalty{color:var(--danger)}

/* Inputs */
.input-field{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:var(--card);resize:none;transition:border-color .15s}
.input-field:focus{outline:none;border-color:var(--primary)}
.input-field::placeholder{color:var(--text-light)}
.input-row{display:flex;gap:8px;margin-bottom:8px}
.input-group{flex:1}
.input-label{font-size:13px;font-weight:600;color:var(--text-sec);margin-bottom:4px;display:block}

/* Buttons */
.btn-primary{width:100%;padding:16px;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;margin-top:8px}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:var(--border);color:var(--text-light);cursor:not-allowed}
.btn-secondary{width:100%;padding:14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-secondary:active{transform:scale(.98)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:30px;font-size:15px;font-weight:600;color:#fff;z-index:1000;animation:toastIn .3s ease,toastOut .3s ease 1.7s forwards;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:calc(var(--max-w) - 32px);text-align:center}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Lookup List */
.search-bar{margin:12px 16px}
.student-list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 16px 6px;background:var(--card);border-radius:var(--radius);cursor:pointer;transition:background .1s;box-shadow:var(--shadow)}
.student-list-item:active{background:var(--border-light)}
.sl-number{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sl-info{flex:1;min-width:0}
.sl-name{font-size:16px;font-weight:700}
.sl-meta{font-size:12px;color:var(--text-sec);margin-top:2px}
.sl-points{font-size:13px;font-weight:700;white-space:nowrap}
.sl-points.positive{color:var(--success)}
.sl-points.negative{color:var(--danger)}
.sl-arrow{color:var(--text-light);font-size:18px}

/* Detail */
.detail-header{display:flex;align-items:center;gap:12px;padding:16px}
.detail-back{width:40px;height:40px;border-radius:50%;border:none;background:var(--border-light);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.detail-back:active{transform:scale(.9)}
.detail-name{font-size:22px;font-weight:800}
.detail-stats{display:flex;gap:8px;padding:0 16px 16px}
.stat-card{flex:1;padding:12px;background:var(--card);border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:22px;font-weight:800}
.stat-label{font-size:11px;color:var(--text-sec);margin-top:2px}

/* Timeline */
.timeline-item{margin:0 16px 8px;padding:12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.timeline-item-header{display:flex;justify-content:space-between;align-items:flex-start}
.timeline-date{font-size:12px;color:var(--text-light);margin-bottom:4px}
.timeline-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.timeline-tag{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:600}
.timeline-tag.memo{background:var(--primary-light);color:var(--primary-dark)}
.timeline-tag.reward{background:var(--success-light);color:var(--success)}
.timeline-tag.penalty{background:var(--danger-light);color:var(--danger)}
.timeline-text{font-size:14px;color:var(--text-sec);line-height:1.4}
.delete-record-btn{background:none;border:none;color:var(--text-light);font-size:16px;cursor:pointer;padding:2px;line-height:1}
.delete-record-btn:hover{color:var(--danger)}

/* ===== Seating ===== */
.seating-controls{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;flex-wrap:wrap;gap:6px}
.seating-rc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-sec)}
.seating-rc select{padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text)}
.seating-podium{text-align:center;padding:6px;margin:4px 16px 8px;background:var(--primary);color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:700;letter-spacing:1px}
.seating-grid{display:grid;gap:5px;padding:0 16px 12px}
.seat{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;transition:all .15s;font-size:12px;font-weight:600;color:var(--text-sec);position:relative}
.seat:active:not(:has(.seat-action-popup)){transform:scale(.95)}
.seat.occupied{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.seat.moving{border-color:var(--warning);background:var(--warning-light);animation:pulse 1s infinite}
.seat.move-target{border-color:var(--success);border-style:dashed}
.seat .seat-num{font-size:10px;color:var(--text-light);line-height:1}
.seat .seat-name{font-size:13px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.seat-action-popup{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:8px;padding:4px;display:flex;gap:2px;z-index:20;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.seat-action-popup.popup-below{bottom:auto;top:calc(100% + 4px)}
.seat-action-popup button{padding:6px 10px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:#fff}
.seat-action-popup button:active{background:rgba(255,255,255,.2)}
.seating-unassigned{padding:8px 16px}
.seating-unassigned-title{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px}
.seating-chip-row{display:flex;flex-wrap:wrap;gap:4px}
.seating-chip{padding:5px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.seating-chip:active{transform:scale(.95)}
.seating-chip.highlight{border-color:var(--success);background:var(--success-light);color:var(--success)}

/* ===== Cleaning ===== */
.cleaning-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.cleaning-header-actions{display:flex;gap:6px}
.cleaning-btn-sm{padding:7px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text)}
.cleaning-btn-sm:active{transform:scale(.95)}
.cleaning-btn-sm.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.cleaning-zone-card{margin:0 16px 8px;padding:12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.cleaning-zone-card.selected{border:2px solid var(--primary);background:var(--primary-light)}
.cleaning-zone-card:not(.selected){border:2px solid transparent}
.cleaning-zone-name{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.cleaning-zone-students{display:flex;flex-wrap:wrap;gap:4px;min-height:28px}
.cleaning-student-chip{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--primary-light);color:var(--primary-dark);cursor:pointer;border:none;font-family:inherit}
.cleaning-student-chip:active{transform:scale(.95)}
.cleaning-empty-zone{font-size:12px;color:var(--text-light);padding:4px 0}
.cleaning-assign-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 16px}
.cleaning-assign-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;border:1.5px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.cleaning-assign-cell:active{transform:scale(.95)}
.cleaning-assign-cell.assigned{border-color:var(--text-light);background:var(--border-light);color:var(--text-light);cursor:default;opacity:.5}
.cleaning-assign-cell.in-zone{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.cleaning-add-zone{display:flex;gap:6px;padding:0 16px 8px}
.cleaning-add-zone input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--card)}
.cleaning-add-zone input:focus{outline:none;border-color:var(--primary)}
.cleaning-add-zone button{padding:10px 14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.cleaning-del-btn{background:none;border:none;color:var(--text-light);font-size:14px;cursor:pointer;padding:2px 4px}
.cleaning-del-btn:hover{color:var(--danger)}
.cleaning-edit-actions{display:flex;align-items:center;gap:2px}
.cleaning-move-btn{background:none;border:none;color:var(--text-light);font-size:16px;cursor:pointer;padding:2px 6px;font-family:inherit;line-height:1}
.cleaning-move-btn:active{transform:scale(.9)}
.cleaning-move-btn:disabled{opacity:.2;cursor:default;transform:none}
.cleaning-notes-section{padding:0 16px 12px}
.cleaning-notes-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--card);resize:vertical;min-height:60px;line-height:1.6;box-sizing:border-box}

/* ===== Diary ===== */
.diary-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.diary-header-title{font-size:16px;font-weight:700;color:var(--text)}
.diary-header-date{font-size:14px;font-weight:600;color:var(--primary)}
.diary-section{margin:0 16px 12px;padding:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.diary-section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.diary-notes{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);resize:vertical;min-height:80px;line-height:1.6;box-sizing:border-box}
.diary-notes:focus{outline:none;border-color:var(--primary)}
.diary-task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.diary-task:last-of-type{border-bottom:none}
.diary-task.done .diary-task-text{text-decoration:line-through;color:var(--text-light)}

.diary-task-check.checked{background:var(--primary);border-color:var(--primary)}
.diary-task-text{flex:1;font-size:13px;font-weight:500;color:var(--text);min-width:0;word-break:break-word}
.diary-task-del{background:none;border:none;color:var(--text-light);font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0}
.diary-task-del:hover{color:var(--danger)}
.diary-add-task{display:flex;gap:6px;margin-top:10px}
.diary-add-task input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg)}

.diary-add-task button{padding:8px 14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.diary-empty{font-size:13px;color:var(--text-light);padding:8px 0;text-align:center}
.diary-print-btns{display:flex;gap:8px;padding:0 16px 12px}
.diary-print-btns button{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.diary-print-btns button:active{transform:scale(.97)}
.diary-print-area,.diary-print-month{display:none}

.dash-bar-fill{height:100%;border-radius:4px;min-width:2px;transition:width .3s}

.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--border-light);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}

.grade-class-row select:focus{outline:none;border-color:var(--primary)}
.student-manage-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.sm-num{font-size:13px;color:var(--text-light);width:24px;text-align:center;flex-shrink:0}

.add-student-row{display:flex;gap:8px;margin-top:8px}
.add-student-row input{flex:1}
.add-btn{padding:10px 16px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.add-btn:active{transform:scale(.96)}
.bulk-textarea{width:100%;min-height:100px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:8px}
.bulk-textarea:focus{outline:none;border-color:var(--primary)}

/* Misc */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;line-height:1.5}
.hint{font-size:12px;color:var(--text-light);padding:4px 0 8px;display:flex;align-items:center;gap:4px}
.confirm-bar{display:flex;gap:8px;margin-top:6px}
.confirm-bar button{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.confirm-yes{background:var(--danger);color:#fff}
.confirm-no{background:var(--border-light);color:var(--text)}
.divider{height:1px;background:var(--border);margin:16px 0}

@media(min-width:480px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
@media(max-width:360px){.student-grid{grid-template-columns:repeat(4,1fr)}.student-cell{height:52px}.student-cell .s-name{font-size:13px}}

  for (var i = 1; i <= total; i++) days.push({d: i, c: true});
  var remain = days.length % 7;
  if (remain > 0) for (var i = 1; i <= 7 - remain; i++) days.push({d: i, c: false});
  return days;
}

function SeatingTab({ students, seating, classInfo, onUpdate, onToast }) {
  const [popup, setPopup] = useState(null);
  const [moveFrom, setMoveFrom] = useState(null);
  const [seatDate, setSeatDate] = useState(new Date().toISOString().slice(0,10));

  var rows = seating.rows || 6;
  var cols = seating.cols || 5;
  var layout = seating.layout || {};

  var getName = function(sid) { var s = students.find(function(x){return x.id===sid;}); return s ? s.name : null; };
  var getNum = function(sid) { var s = students.find(function(x){return x.id===sid;}); return s ? s.number : ''; };

  var assignedIds = new Set(Object.values(layout));
  var unassigned = students.filter(function(s){ return !assignedIds.has(s.id); });

  var setRC = function(r, c) {
    var newLayout = {};
    var overflow = [];
    Object.keys(layout).forEach(function(key){
      var parts = key.split('-');
      var kr = Number(parts[0]); var kc = Number(parts[1]);
      if (kr < r && kc < c) { newLayout[key] = layout[key]; }
      else { overflow.push(layout[key]); }
    });
    overflow.forEach(function(sid){
      for(var ri=0;ri<r;ri++){for(var ci=0;ci<c;ci++){
        var k=ri+'-'+ci;
        if(!newLayout[k]){newLayout[k]=sid;sid=null;break;}
      }if(!sid)break;}
    });
    onUpdate({ rows: r, cols: c, layout: newLayout }); setPopup(null); setMoveFrom(null);
  };

  var handleSeatClick = function(key) {
    if (moveFrom) {
      var newLayout = Object.assign({}, layout);
      var fromVal = newLayout[moveFrom] || null;
      var toVal = newLayout[key] || null;
      if (toVal) newLayout[moveFrom] = toVal; else delete newLayout[moveFrom];
      if (fromVal) newLayout[key] = fromVal; else delete newLayout[key];
      onUpdate({ rows: rows, cols: cols, layout: newLayout });
      setMoveFrom(null); setPopup(null);
      onToast('자리 이동 완료');
      return;
    }
    if (layout[key]) { setPopup(popup === key ? null : key); }
    else { setPopup(popup === key ? null : key); }
  };

  var assignStudent = function(key, sid) {
    var newLayout = Object.assign({}, layout);
    newLayout[key] = sid;
    onUpdate({ rows: rows, cols: cols, layout: newLayout });
    setPopup(null); onToast(getName(sid) + ' 배치 완료');
  };

  var clearSeat = function(key) {
    var newLayout = Object.assign({}, layout);
    delete newLayout[key];
    onUpdate({ rows: rows, cols: cols, layout: newLayout });
    setPopup(null); onToast('자리 비움');
  };

  var startMove = function(key) { setMoveFrom(key); setPopup(null); };
  var cancelMove = function() { setMoveFrom(null); };

  if (!students.length) return html`<div className="empty-state"><div className="empty-icon">💺</div><div className="empty-text">학생 명단을 먼저 등록해주세요.</div></div>`;

  return html`<div>
    <div className="seating-controls">
      <div className="seating-rc">
        <span>행</span>
        <select value=${String(rows)} onChange=${function(e){setRC(Number(e.target.value),cols);}}>
          ${[4,5,6,7,8].map(function(n){return html`<option key=${n} value=${String(n)}>${n}</option>`;})}
        </select>
        <span>× 열</span>
        <select value=${String(cols)} onChange=${function(e){setRC(rows,Number(e.target.value));}}>
          ${[3,4,5,6,7,8].map(function(n){return html`<option key=${n} value=${String(n)}>${n}</option>`;})}
        </select>
      </div>
      ${moveFrom ? html`<button className="cleaning-btn-sm" onClick=${cancelMove}>이동 취소</button>` : null}
      <input type="date" value=${seatDate} onChange=${function(e){setSeatDate(e.target.value);}} style=${{padding:'4px 6px',border:'1.5px solid var(--border)',borderRadius:6,fontSize:13,fontFamily:'inherit',background:'var(--card)',color:'var(--text)'}} />
      <button className="cleaning-btn-sm" onClick=${function(){var s=document.getElementById('print-orient');if(!s){s=document.createElement('style');s.id='print-orient';document.head.appendChild(s);}s.textContent='@media print{@page{size:A4 landscape;margin:10mm 15mm}}';window.print();}}>🖨️ 인쇄</button>
      <button className="cleaning-btn-sm" onClick=${function(){var s=document.getElementById('print-orient');if(!s){s=document.createElement('style');s.id='print-orient';document.head.appendChild(s);}s.textContent='@media print{@page{size:A4 landscape;margin:10mm 15mm}}';var app=document.querySelector('.app');app.setAttribute('data-print','seat-empty');window.print();setTimeout(function(){app.removeAttribute('data-print');},500);}}>🖨️ 빈자리</button>
    </div>
    <div className="seating-grid" style=${{gridTemplateColumns:'repeat('+cols+',1fr)'}}>
      ${Array.from({length:rows}).map(function(_,i){
        var r = rows - 1 - i;
        return Array.from({length:cols}).map(function(_,j){
          var c = cols - 1 - j;
          var key = r+'-'+c;
          var sid = layout[key];
          var name = sid ? getName(sid) : null;
          var isMoving = moveFrom === key;
          var isMoveTarget = moveFrom && moveFrom !== key;
          var cls = 'seat' + (sid ? ' occupied' : '') + (isMoving ? ' moving' : '') + (isMoveTarget ? ' move-target' : '');
          return html`<div key=${key} className=${cls} onClick=${function(){handleSeatClick(key);}}>
            ${sid ? html`<span className="seat-num">${getNum(sid)}</span><span className="seat-name">${name}</span>` : html`<span style=${{fontSize:16,opacity:.3}}>+</span>`}
            ${popup === key && sid && !moveFrom ? html`
              <div className=${'seat-action-popup' + (i===0?' popup-below':'')} onMouseDown=${function(e){e.stopPropagation();}} onTouchStart=${function(e){e.stopPropagation();}}>
                <button onClick=${function(e){e.stopPropagation();startMove(key);}}>이동</button>
                <button onClick=${function(e){e.stopPropagation();clearSeat(key);}}>비우기</button>

            ${popup === key && !sid && !moveFrom && unassigned.length > 0 ? html`
              <div className=${'seat-action-popup' + (i===0?' popup-below':'')} style=${{flexDirection:'column',maxHeight:150,overflowY:'auto',minWidth:80}} onMouseDown=${function(e){e.stopPropagation();}} onTouchStart=${function(e){e.stopPropagation();}}>

          </div>`;
        });
      })}
    </div>
    <div className="seating-podium">교 탁</div>
    ${unassigned.length > 0 ? html`
      <div className="seating-unassigned">
        <div className="seating-unassigned-title">미배치 학생 (${unassigned.length}명)</div>
        <div className="seating-chip-row">
          ${unassigned.map(function(s){ return html`<span key=${s.id} className="seating-chip">${s.number}. ${s.name}</span>`; })}
        </div>
      </div>` : null}
    ${moveFrom ? html`<div style=${{padding:'8px 16px',fontSize:13,color:'var(--warning)',fontWeight:600}}>💡 이동할 자리를 선택하세요 (빈자리 또는 다른 학생과 교환)</div>` : null}

    <div className="seating-print-area">
      <h2>${classInfo.className || ''} 자리배치도</h2>
      <div className="print-sub">${seatDate.replace(/-/g,'.')}~</div>
      <table>
        <tbody>
          ${Array.from({length:rows}).map(function(_,i){
            var r = rows - 1 - i;
            return html`<tr key=${r}>
              ${Array.from({length:cols}).map(function(_,j){
                var c = cols - 1 - j;
                var key = r+'-'+c;
                var sid = layout[key];
                var name = sid ? getName(sid) : '';
                var num = sid ? getNum(sid) : '';
                return html`<td key=${key} className="seating-print-cell">
                  ${sid ? html`<div className="sp-num">${num}</div><div className="sp-name">${name}</div>` : null}
                </td>`;
              })}
            </tr>`;
          })}
          <tr><td colSpan=${cols} className="seating-print-podium">[ 교　탁 ]</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

// ===== CleaningTab =====
function CleaningTab({ students, cleaning, classInfo, onUpdate, onToast }) {
  const [selZone, setSelZone] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [newZoneName, setNewZoneName] = useState('');

  var zones = cleaning.zones || [];
  var assignments = cleaning.assignments || {};
  var notes = cleaning.notes || '';

  var allAssigned = {};
  zones.forEach(function(z){ (assignments[z.id]||[]).forEach(function(sid){ allAssigned[sid]=z.id; }); });

  var addZone = function() {
    var n = newZoneName.trim();
    if (!n) return;
    var nz = zones.concat([{id:uid(),name:n}]);
    onUpdate({zones:nz,assignments:assignments,notes:notes});
    setNewZoneName(''); onToast(n+' 구역 추가');
  };

  var delZone = function(zid) {
    var nz = zones.filter(function(z){return z.id!==zid;});
    var na = Object.assign({},assignments); delete na[zid];
    onUpdate({zones:nz,assignments:na,notes:notes});
    if (selZone===zid) setSelZone(null);
    onToast('구역 삭제 완료');
  };

  var moveZone = function(zid, dir) {
    var idx = zones.findIndex(function(z){return z.id===zid;});
    if (idx < 0) return;
    var ni = idx + dir;
    if (ni < 0 || ni >= zones.length) return;
    var nz = zones.slice();
    var tmp = nz[idx]; nz[idx] = nz[ni]; nz[ni] = tmp;
    onUpdate({zones:nz,assignments:assignments,notes:notes});
  };

  var toggleAssign = function(sid) {
    if (!selZone) return;
    var cur = (assignments[selZone]||[]).slice();
    var idx = cur.indexOf(sid);
    if (idx>=0) { cur.splice(idx,1); }
    else {
      Object.keys(assignments).forEach(function(zid){ var a=assignments[zid]||[]; var i=a.indexOf(sid); if(i>=0){var na=Object.assign({},assignments);na[zid]=a.filter(function(x){return x!==sid;});assignments=na;} });
      cur.push(sid);
    }
    var na = Object.assign({},assignments); na[selZone]=cur;
    onUpdate({zones:zones,assignments:na,notes:notes});
  };

  var updateNotes = function(val) {
    onUpdate({zones:zones,assignments:assignments,notes:val});
  };

  var getName = function(sid) { var s = students.find(function(x){return x.id===sid;}); return s ? s.name : '?'; };
  var getNum = function(sid) { var s = students.find(function(x){return x.id===sid;}); return s ? s.number : 0; };

  var doPrint = function() { var s=document.getElementById('print-orient');if(!s){s=document.createElement('style');s.id='print-orient';document.head.appendChild(s);}s.textContent='@media print{@page{size:A4 portrait;margin:15mm}}';window.print(); };

  if (!students.length) return html`<div className="empty-state"><div className="empty-icon">🧹</div><div className="empty-text">학생 명단을 먼저 등록해주세요.</div></div>`;

  return html`<div>
    <div className="cleaning-header">
      <div className="section-title" style=${{margin:0}}>청소구역 배정</div>
      <div className="cleaning-header-actions">
        <button className=${'cleaning-btn-sm' + (editMode?' active':'')} onClick=${function(){setEditMode(!editMode);setSelZone(null);}}>
          ${editMode ? '완료' : '구역 편집'}
        </button>
        <button className="cleaning-btn-sm" onClick=${doPrint}>🖨️ 인쇄</button>
      </div>
    </div>

    ${editMode ? html`
      <div className="cleaning-add-zone">
        <input placeholder="새 구역 이름" value=${newZoneName} onInput=${function(e){setNewZoneName(e.target.value);}}
          onKeyDown=${function(e){if(e.key==='Enter'&&!e.nativeEvent.isComposing)addZone();}} />
        <button onClick=${addZone}>추가</button>
      </div>` : null}

    ${zones.map(function(z, zi) {
      var members = (assignments[z.id]||[]);
      var isSel = selZone === z.id && !editMode;
      return html`
        <div key=${z.id} className=${'cleaning-zone-card' + (isSel?' selected':'')}
          onClick=${function(){ if(!editMode) setSelZone(selZone===z.id?null:z.id); }}>
          <div className="cleaning-zone-name">
            <span>${z.name} (${members.length}명)</span>
            ${editMode ? html`<div className="cleaning-edit-actions">
              <button className="cleaning-move-btn" disabled=${zi===0} onClick=${function(e){e.stopPropagation();moveZone(z.id,-1);}}>▲</button>
              <button className="cleaning-move-btn" disabled=${zi===zones.length-1} onClick=${function(e){e.stopPropagation();moveZone(z.id,1);}}>▼</button>
              <button className="cleaning-del-btn" onClick=${function(e){e.stopPropagation();delZone(z.id);}}>✕</button>
            </div>` : null}
          </div>
          <div className="cleaning-zone-students">
            ${members.length === 0
              ? html`<span className="cleaning-empty-zone">배정된 학생 없음</span>`
              : members.map(function(sid){ return html`<button key=${sid} className="cleaning-student-chip"
                  onClick=${function(e){e.stopPropagation(); if(!editMode){var cur=(assignments[z.id]||[]).filter(function(x){return x!==sid;}); var na=Object.assign({},assignments);na[z.id]=cur;onUpdate({zones:zones,assignments:na,notes:notes});}}}>${getNum(sid)}. ${getName(sid)}</button>`; })}
          </div>
        </div>`;
    })}

    ${selZone && !editMode ? html`
      <div style=${{padding:'8px 16px 4px'}}>
        <div className="section-title">학생을 탭하여 배정 / 해제</div>
      </div>
      <div className="cleaning-assign-grid">
        ${students.map(function(s){
          var inThisZone = (assignments[selZone]||[]).indexOf(s.id)>=0;
          var inOther = allAssigned[s.id] && allAssigned[s.id]!==selZone;
          var cls = 'cleaning-assign-cell' + (inThisZone?' in-zone':'') + (inOther?' assigned':'');
          return html`<button key=${s.id} className=${cls} onClick=${function(){if(!inOther)toggleAssign(s.id);}}>
            <span style=${{fontSize:10,color:'var(--text-light)'}}>${s.number}</span>
            <span>${s.name}</span>
          </button>`;
        })}
      </div>` : null}

    <div className="cleaning-notes-section">
      <div className="section-title" style=${{padding:'12px 16px 4px'}}>청소 유의사항</div>
      <textarea className="cleaning-notes-input" placeholder=${"청소 유의사항을 입력하세요.\n예) 청소시간이 짧아요. 빨리빨리~"} value=${notes} onInput=${function(e){updateNotes(e.target.value);}} rows="4"></textarea>
    </div>

    <div className="print-area">
      <h2>${classInfo.className || ''} 청소구역표</h2>
      <div className="print-sub">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\./g,'.').replace(/\s/g,'')}~</div>
      <table className="print-clean-table">
        <thead><tr><th>청소구역</th><th>담당 학생</th></tr></thead>
        <tbody>
          ${zones.map(function(z){
            var members = (assignments[z.id]||[]).map(function(sid){return getNum(sid)+'. '+getName(sid);}).join(', ');
            return html`<tr key=${z.id}><td className="print-zone-name">${z.name}</td><td className="print-zone-members">${members || '-'}</td></tr>`;
          })}
        </tbody>
      </table>
      ${notes.trim() ? html`<div className="print-notes-box">
        <div className="print-notes-title">청소 유의사항</div>
        <div className="print-notes-content">${notes.split('\n').map(function(line,i){return html`<div key=${i}>${line || '\u00A0'}</div>`;})}</div>
      </div>` : null}
      <div className="print-deco">
        <span>🧹</span><span>✨</span><span>🧤</span><span>🪣</span><span>🧽</span><span>🫧</span><span>🗑️</span><span>💪</span><span>🌟</span><span>🧹</span>
      </div>
    </div>
  </div>`;
}

// ===== DiaryTab =====
function DiaryTab({ diary, date, classInfo, onUpdate, onToast }) {
  const [newTask, setNewTask] = useState('');
  var entry = diary[date] || { notes: '', tasks: [] };
  var m = parseInt(date.split('-')[1]);
  var d = parseInt(date.split('-')[2]);

  var updateEntry = function(patch) {
    var ne = Object.assign({}, entry, patch);
    var nd = Object.assign({}, diary);
    nd[date] = ne;
    onUpdate(nd);
  };

  var addTask = function() {
    var txt = newTask.trim();
    if (!txt) return;
    var t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text: txt, done: false };
    updateEntry({ tasks: entry.tasks.concat([t]) });
    setNewTask('');
    onToast('할 일 추가');
  };

  var toggleTask = function(id) {
    updateEntry({ tasks: entry.tasks.map(function(t){ return t.id===id ? Object.assign({},t,{done:!t.done}) : t; }) });
  };

  var deleteTask = function(id) {
    updateEntry({ tasks: entry.tasks.filter(function(t){ return t.id!==id; }) });
    onToast('삭제 완료');
  };

  var doPrint = function(mode) {
    var app = document.querySelector('.app');
    var s = document.getElementById('print-orient');
    if(!s){s=document.createElement('style');s.id='print-orient';document.head.appendChild(s);}
    s.textContent = mode === 'month' ? '@media print{@page{size:A4 landscape;margin:10mm 15mm}}' : '@media print{@page{size:A4 portrait;margin:15mm}}';
    app.setAttribute('data-print', mode === 'month' ? 'diary-month' : 'diary-day');
    var cleanup = function(){ app.removeAttribute('data-print'); };
    window.addEventListener('afterprint', cleanup, {once:true});
    setTimeout(function(){ window.print(); }, 100);
  };

  var y = parseInt(date.split('-')[0]);
  var dayOfWeek = ['일','월','화','수','목','금','토'][new Date(date).getDay()];
  var className = classInfo.className || '';

  var monthDays = Object.keys(diary).filter(function(k){ return k.startsWith(y+'-'+(m<10?'0'+m:m)); }).sort();

  return html`<div>
    <div className="diary-header">
      <span className="diary-header-title">📔 학급일지</span>
      <span className="diary-header-date">${m}월 ${d}일</span>
    </div>

    <div className="diary-section">
      <div className="diary-section-title">📋 전달사항</div>
      <textarea className="diary-notes" placeholder=${"오늘의 전달사항을 입력하세요.\n예) 학부모 상담 안내문 배부"} value=${entry.notes} onInput=${function(e){ updateEntry({ notes: e.target.value }); }} rows="4"></textarea>
    </div>

    <div className="diary-section">
      <div className="diary-section-title">✅ 할 일</div>
      ${entry.tasks.length === 0 ? html`<div className="diary-empty">등록된 할 일이 없습니다</div>` : null}
      ${entry.tasks.map(function(t) {
        return html`<div key=${t.id} className=${'diary-task' + (t.done?' done':'')}>
          <div className=${'diary-task-check' + (t.done?' checked':'')} onClick=${function(){toggleTask(t.id);}}>${t.done?'✓':''}</div>
          <span className="diary-task-text">${t.text}</span>
          <button className="diary-task-del" onClick=${function(){deleteTask(t.id);}}>✕</button>
        </div>`;
      })}
      <div className="diary-add-task">
        <input placeholder="새 할 일 입력" value=${newTask} onInput=${function(e){setNewTask(e.target.value);}} onKeyDown=${function(e){if(e.key==='Enter')addTask();}} />
        <button onClick=${addTask}>추가</button>
      </div>
    </div>

    <div className="diary-print-btns">
      <button onClick=${function(){doPrint('day');}}>🖨️ 오늘 인쇄</button>
      <button onClick=${function(){doPrint('month');}}>🖨️ ${m}월 인쇄</button>
    </div>

    <div className="diary-print-area">
      <h2>${className} 학급일지</h2>
      <div className="print-sub">${y}년 ${m}월 ${d}일 (${dayOfWeek})</div>
      <table className="diary-print-table">
        <tbody>
          <tr>
            <td className="dp-label">전달사항</td>
            <td>${entry.notes ? entry.notes.split('\n').map(function(line,i){return html`<div key=${i}>${line || '\u00A0'}</div>`;}) : html`<span style=${{color:'#999'}}>없음</span>`}</td>
          </tr>
          <tr>
            <td className="dp-label">할 일</td>
            <td>${entry.tasks.length === 0 ? html`<span style=${{color:'#999'}}>없음</span>` : entry.tasks.map(function(t){
              return html`<div key=${t.id} className=${'diary-print-task'+(t.done?' diary-print-task-done':'')}>${t.done?'☑':'☐'} ${t.text}</div>`;
            })}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div className="diary-print-month">
      <h2>${className} ${m}월 학급일지</h2>
      <div className="print-sub">${y}년 ${m}월</div>
      ${monthDays.length === 0 ? html`<div style=${{textAlign:'center',fontSize:'14pt',color:'#999',padding:'20mm 0'}}>기록된 일지가 없습니다</div>` : html`
        <table className="diary-print-table">
          <thead><tr><th>날짜</th><th>전달사항</th><th>할 일</th></tr></thead>
          <tbody>
            ${monthDays.map(function(dk){
              var de = diary[dk];
              var dd = parseInt(dk.split('-')[2]);
              var dw = ['일','월','화','수','목','금','토'][new Date(dk).getDay()];
              return html`<tr key=${dk}>
                <td className="dp-date">${dd}일(${dw})</td>
                <td>${de.notes ? de.notes.split('\n').map(function(line,i){return html`<div key=${i}>${line || '\u00A0'}</div>`;}) : '-'}</td>
                <td>${(de.tasks||[]).length===0 ? '-' : (de.tasks||[]).map(function(t){
                  return html`<div key=${t.id} className=${'diary-print-task'+(t.done?' diary-print-task-done':'')}>${t.done?'☑':'☐'} ${t.text}</div>`;
                })}</td>
              </tr>`;
            })}
          </tbody>
        </table>
      `}
    </div>
  </div>`;
}

// ===== StudentDetail =====
function StudentDetail({ student, memos, points, onBack, onDeleteMemo, onDeletePoint, onToast }) {
  const [delId, setDelId] = useState(null);
  var sMemos = memos.filter(function(m){ return m.studentId === student.id; });
  var sPoints = points.filter(function(p){ return p.studentId === student.id; });
  var totalR = sPoints.filter(function(p){return p.type==='reward';}).reduce(function(s,p){return s+p.points;},0);
  var totalP = sPoints.filter(function(p){return p.type==='penalty';}).reduce(function(s,p){return s+p.points;},0);

  var timeline = sMemos.map(function(m){ return {id:m.id,date:m.date,ca:m.createdAt,type:'memo',rec:m}; })
    .concat(sPoints.map(function(p){ return {id:p.id,date:p.date,ca:p.createdAt,type:'point',rec:p}; }))
    .sort(function(a,b){ return b.ca.localeCompare(a.ca); });

  var doDelete = function(e) {
    if (e.type === 'memo') onDeleteMemo(e.id); else onDeletePoint(e.id);
    setDelId(null); onToast('삭제 완료');
  };

  return html`<div>
    <div className="detail-header">
      <button className="detail-back" onClick=${onBack}>←</button>
      <div>
        <div className="detail-name">${student.name}</div>
        <div style=${{fontSize:13,color:'var(--text-sec)'}}>${student.number}번</div>
      </div>
    </div>

    <div className="detail-stats">
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--primary)'}}>${sMemos.length}</div><div className="stat-label">메모</div></div>
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--success)'}}>${totalR}</div><div className="stat-label">상점</div></div>
      <div className="stat-card"><div className="stat-value" style=${{color:'var(--danger)'}}>${totalP}</div><div className="stat-label">벌점</div></div>
    </div>

    <div className="section-title" style=${{padding:'0 16px 8px'}}>전체 기록 (${timeline.length}건)</div>

    ${timeline.length === 0
      ? html`<div className="empty-state" style=${{padding:24}}><div className="empty-text">기록이 없습니다</div></div>`
      : timeline.map(function(e) { return html`
        <div className="timeline-item" key=${e.id}>
          <div className="timeline-item-header">
            <div className="timeline-date">${fmtDate(e.date)}</div>
            <button className="delete-record-btn" onClick=${function(){setDelId(delId===e.id?null:e.id);}}>✕</button>
          </div>
          ${e.type === 'memo' ? html`
            <div className="timeline-tags">
              ${e.rec.categories.map(function(c){ return html`<span key=${c} className="timeline-tag memo">${c}</span>`; })}
            </div>
            ${e.rec.memo ? html`<div className="timeline-text">${e.rec.memo}</div>` : null}
          ` : html`
            <div className="timeline-tags">
              <span className=${'timeline-tag ' + e.rec.type}>${e.rec.type==='reward'?'상점':'벌점'} +${e.rec.points}</span>
              ${e.rec.reasons.map(function(r){ return html`<span key=${r} className=${'timeline-tag ' + e.rec.type}>${r}</span>`; })}
            </div>
            ${e.rec.additionalReason ? html`<div className="timeline-text">${e.rec.additionalReason}</div>` : null}
          `}
          ${delId===e.id ? html`
            <div className="confirm-bar">
              <button className="confirm-yes" onClick=${function(){doDelete(e);}}>삭제</button>
              <button className="confirm-no" onClick=${function(){setDelId(null);}}>취소</button>
            </div>` : null}
        </div>
      `; })
    }
  </div>`;
}

// ===== LookupTab =====
function LookupTab({ students, memos, points, date, onDeleteMemo, onDeletePoint, onToast }) {
  const [search, setSearch] = useState('');
  const [selStudent, setSelStudent] = useState(null);

  // 기간 검색 기본값: 이번 달 1일 ~ 오늘
  var today = date || new Date().toISOString().slice(0,10);
  var defFrom = today.slice(0,7) + '-01';
  const [dateFrom, setDateFrom] = useState(defFrom);
  const [dateTo, setDateTo] = useState(today);
  const [rangeLabel, setRangeLabel] = useState('이번 달');

  if (selStudent) return html`<${StudentDetail}
    student=${selStudent} memos=${memos} points=${points}
    onBack=${function(){setSelStudent(null);}} onDeleteMemo=${onDeleteMemo} onDeletePoint=${onDeletePoint} onToast=${onToast} />`;

  // 기간 프리셋
  var setPreset = function(label) {
    setRangeLabel(label);
    var d = new Date(today);
    if (label==='오늘') { setDateFrom(today); setDateTo(today); }
    else if (label==='이번 주') {
      var day = d.getDay(); var diff = day === 0 ? 6 : day - 1;
      var mon = new Date(d); mon.setDate(d.getDate() - diff);
      setDateFrom(mon.toISOString().slice(0,10)); setDateTo(today);
    }
    else if (label==='이번 달') { setDateFrom(today.slice(0,7)+'-01'); setDateTo(today); }
    else if (label==='전체') { setDateFrom('2000-01-01'); setDateTo('2099-12-31'); }
  };
  var onFromChange = function(e){ setDateFrom(e.target.value); setRangeLabel('직접설정'); };
  var onToChange = function(e){ setDateTo(e.target.value); setRangeLabel('직접설정'); };

  // 기간 필터링된 데이터 (현재 존재하는 학생만)
  var studentIds = new Set(students.map(function(s){return s.id;}));
  var fMemos = memos.filter(function(m){ return m.date && m.date >= dateFrom && m.date <= dateTo && studentIds.has(m.studentId); });
  var fPoints = points.filter(function(p){ return p.date && p.date >= dateFrom && p.date <= dateTo && studentIds.has(p.studentId); });

  // 이벤트 학생 목록
  var eventStudentIds = new Set();
  fMemos.forEach(function(m){ eventStudentIds.add(m.studentId); });
  fPoints.forEach(function(p){ eventStudentIds.add(p.studentId); });

  var baseList = search ? students.filter(function(s){ return s.name.includes(search) || String(s.number).includes(search); })
    : students.filter(function(s){ return eventStudentIds.has(s.id); });

  var getNet = function(sid) {
    var sp = fPoints.filter(function(p){return p.studentId===sid;});
    return sp.filter(function(p){return p.type==='reward';}).reduce(function(s,p){return s+p.points;},0)
         - sp.filter(function(p){return p.type==='penalty';}).reduce(function(s,p){return s+p.points;},0);
  };
  var getMemoCnt = function(sid) { return fMemos.filter(function(m){return m.studentId===sid;}).length; };

  // 기간 기반 통계 계산
  var totalStudents = students.length;
  var absentCats = ['병결','무단결석'];
  var hasData = fMemos.length > 0 || fPoints.length > 0;

  // 출석률: 기간 내 출결 메모가 있는 날짜별로 결석 학생 수를 계산하여 평균
  var absentEntries = fMemos.filter(function(m){ return m.categories && m.categories.some(function(c){return absentCats.indexOf(c)>=0;}); });
  var absentByDate = {};
  absentEntries.forEach(function(m){
    if(!absentByDate[m.date]) absentByDate[m.date] = new Set();
    absentByDate[m.date].add(m.studentId);
  });
  var absentDates = Object.keys(absentByDate);
  var attendRate = '--';
  if (absentDates.length > 0 && totalStudents > 0) {
    var totalRate = 0;
    absentDates.forEach(function(d){ totalRate += (totalStudents - absentByDate[d].size) / totalStudents; });
    attendRate = Math.round(totalRate / absentDates.length * 100);
  } else if (hasData && totalStudents > 0) {
    attendRate = 100;
  }

  var totalReward = fPoints.filter(function(p){return p.type==='reward';}).reduce(function(s,p){return s+p.points;},0);
  var totalPenalty = fPoints.filter(function(p){return p.type==='penalty';}).reduce(function(s,p){return s+p.points;},0);

  // 카테고리별 메모 빈도 (기간 기반)
  var catCounts = {};
  var maxCatCount = 0;
  Object.keys(MEMO_CATEGORIES).forEach(function(g){ MEMO_CATEGORIES[g].forEach(function(c){ catCounts[c]=0; }); });
  fMemos.forEach(function(m){ if(m.categories){m.categories.forEach(function(c){ if(catCounts[c]!==undefined){catCounts[c]++;} });} });
  Object.keys(catCounts).forEach(function(c){ if(catCounts[c]>maxCatCount) maxCatCount=catCounts[c]; });

  var barColors = {'출결':'#0891b2','상담관련':'#8b5cf6','생활지도 및 학습관련':'#f59e0b','기타':'#64748b'};

  // 기간 표시 텍스트
  var rangeText = dateFrom === dateTo ? dateFrom.replace(/-/g,'.') : dateFrom.replace(/-/g,'.') + ' ~ ' + dateTo.replace(/-/g,'.');

  if (!students.length) return html`<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">등록된 학생이 없습니다</div></div>`;

  return html`<div>
    <div className="dash-range">
      <div className="dash-range-presets">
        ${['오늘','이번 주','이번 달','전체'].map(function(lb){
          return html`<button key=${lb} className=${'dash-range-btn'+(rangeLabel===lb?' active':'')} onClick=${function(){setPreset(lb);}}>${lb}</button>`;
        })}
      </div>
      <div className="dash-range-dates">
        <input type="date" className="dash-date-input" value=${dateFrom} onChange=${onFromChange} />
        <span className="dash-range-sep">~</span>
        <input type="date" className="dash-date-input" value=${dateTo} onChange=${onToChange} />
      </div>
    </div>

    <div className="dash-cards">
      <div className="dash-card">
        <div className="dash-card-value" style=${{color:'var(--primary)'}}>${attendRate==='--'?'--':attendRate+'%'}</div>
        <div className="dash-card-label">평균 출석률</div>
      </div>
      <div className="dash-card">
        <div className="dash-card-value" style=${{color:'var(--success)'}}>+${totalReward}</div>
        <div className="dash-card-label">상점 합계</div>
      </div>
      <div className="dash-card">
        <div className="dash-card-value" style=${{color:'var(--danger)'}}>-${totalPenalty}</div>
        <div className="dash-card-label">벌점 합계</div>
      </div>
    </div>

    <div className="dash-section">
      <div className="dash-section-title">카테고리별 메모 빈도</div>
      ${Object.keys(MEMO_CATEGORIES).map(function(g){ var color=barColors[g]||'#94a3b8'; return MEMO_CATEGORIES[g].map(function(c){
        var pct = maxCatCount>0 ? Math.round(catCounts[c]/maxCatCount*100) : 0;
        return html`<div className="dash-bar-row" key=${c}>
          <div className="dash-bar-label">${c}</div>
          <div className="dash-bar-track"><div className="dash-bar-fill" style=${{width:pct+'%',background:color}}></div></div>
          <div className="dash-bar-count">${catCounts[c]}</div>
        </div>`;
      }); })}
    </div>

    <div className="dash-divider"></div>

    <div className="search-bar">
      <input className="input-field" placeholder="🔍 학생 이름 검색..." value=${search} onInput=${function(e){setSearch(e.target.value);}} />
    </div>
    ${!search && html`<div style=${{padding:'4px 16px',fontSize:'11px',color:'var(--text-light)'}}>${rangeText} 이벤트 학생 ${eventStudentIds.size}명</div>`}
    ${baseList.length === 0 && !search ? html`<div className="empty-state" style=${{padding:'24px 0'}}><div className="empty-icon">📭</div><div className="empty-text">해당 기간 기록된 이벤트가 없습니다</div></div>` : null}
    ${baseList.map(function(s) {
      var net = getNet(s.id);
      var cnt = getMemoCnt(s.id);
      var mCnt = fMemos.filter(function(m){return m.studentId===s.id;}).length;
      var pCnt = fPoints.filter(function(p){return p.studentId===s.id;}).length;
      return html`
        <div key=${s.id} className="student-list-item" onClick=${function(){setSelStudent(s);}}>
          <div className="sl-number">${s.number}</div>
          <div className="sl-info">
            <div className="sl-name">${s.name}</div>
            <div className="sl-meta">메모 ${mCnt}건${pCnt>0?' · 상벌점 '+pCnt+'건':''}</div>
          </div>
          ${net !== 0 ? html`<div className=${'sl-points ' + (net>0?'positive':'negative')}>${net>0?'상점 +'+net:'벌점 '+net}</div>` : null}
          <div className="sl-arrow">›</div>
        </div>`;
    })}
  </div>`;
}

  const [editMode, setEditMode] = useState(false);
  const [pos, setPos] = useState(loadAfPos);
  const [dragging, setDragging] = useState(null);
  const previewRef = useRef(null);

  var selStudent = students.find(function(s){ return s.id === selSt; });
  var cnMatch = (classInfo.className || '').match(/(\d+)\s*학년\s*(\d+)\s*반/);

  var classStr = cnMatch ? cnMatch[2] : '__';

  var doPrint = function() {
    if (!selSt) { onToast('학생을 선택하세요', 'error'); return; }
    if (!reason.trim()) { onToast('사유를 입력하세요', 'error'); return; }
    var app = document.querySelector('.app');
    app.setAttribute('data-print', 'approve-form');
    var s = document.getElementById('print-orient');
    if (!s) { s = document.createElement('style'); s.id = 'print-orient'; document.head.appendChild(s); }
    s.textContent = '@media print{@page{size:A4 portrait;margin:0}}';
    setTimeout(function(){ window.print(); }, 100);
    setTimeout(function(){ app.removeAttribute('data-print'); }, 500);
  };

  // 드래그 핸들러
  var onPointerDown = function(key, e) {
    e.preventDefault();
    var rect = previewRef.current.getBoundingClientRect();
    var scaleX = 210 / rect.width;
    var scaleY = 297 / rect.height;
    var startX = e.clientX, startY = e.clientY;
    var startPos = {top: pos[key].top, left: pos[key].left};

    var onMove = function(ev) {
      var dx = (ev.clientX - startX) * scaleX;
      var dy = (ev.clientY - startY) * scaleY;
      setPos(function(p) {
        var np = Object.assign({}, p);
        np[key] = {top: Math.round(startPos.top + dy), left: Math.round(startPos.left + dx)};
        return np;
      });
    };
    var onUp = function() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      setPos(function(p) { saveAfPos(p); return p; });
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  };

            </div>
          </div>
          <div style=${{marginBottom:12}}>
            <div style=${{fontSize:12,fontWeight:700,color:'var(--text-sec)',marginBottom:6}}>학생 선택</div>
            <div style=${{display:'flex',flexWrap:'wrap',gap:4}}>
              ${students.map(function(s){
                return html`<button key=${s.id} className=${'tag' + (selSt===s.id?' selected':'')} style=${{fontSize:12,padding:'4px 8px'}} onClick=${function(){setSelSt(selSt===s.id?null:s.id);}}>${s.number}. ${s.name}</button>`;
              })}
            </div>
          </div>
          <div style=${{marginBottom:12}}>
            <div style=${{fontSize:12,fontWeight:700,color:'var(--text-sec)',marginBottom:6}}>사유</div>
            <input className="input-field" placeholder="병원 방문 등" value=${reason} onInput=${function(e){setReason(e.target.value);}} />

          ${formType==='조퇴' ? html`

              <input type="number" className="input-field" style=${{width:50,textAlign:'center',padding:'6px 4px'}} placeholder="교시" min="1" max="8" value=${jFromP} onInput=${function(e){setJFromP(e.target.value);}} />

// ===== Settings =====
function Settings({ classInfo, students, memos, points, onUpdateCI, onUpdateSt, onCleanupStudent, onResetData, onClose, onToast, onReload }) {
  const [sn, setSn] = useState(classInfo.schoolName);
  const [tn, setTn] = useState(classInfo.teacherName);
  var parsedGrade = ''; var parsedClass = '';
  if (classInfo.className) {
    var gm = classInfo.className.match(/(\d+)\s*학년/);
    var cm = classInfo.className.match(/(\d+)\s*반/);
    if (gm) parsedGrade = gm[1];
    if (cm) parsedClass = cm[1];
  }
  const [grade, setGrade] = useState(parsedGrade);
  const [cls, setCls] = useState(parsedClass);
  const [newName, setNewName] = useState('');
  const [bulk, setBulk] = useState('');
  const [showBulk, setShowBulk] = useState(false);
  const [delConfirm, setDelConfirm] = useState(null);
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState('');
  const [pinInput, setPinInput] = useState('');
  const [hasPin, setHasPin] = useState(!!load(KEYS.pin,''));
  const [resetConfirm, setResetConfirm] = useState(false);
  const [logo, setLogo] = useState(classInfo.logo || '');
  const fileRef = useRef(null);
  const csvRef = useRef(null);
  const logoRef = useRef(null);

  var saveCI = function() {
    var cnVal = '';
    if (grade && cls) cnVal = grade + '학년 ' + cls + '반';
    else if (grade) cnVal = grade + '학년';
    else if (cls) cnVal = cls + '반';
    else cnVal = '담임반';
    onUpdateCI({ schoolName: sn.trim(), teacherName: tn.trim(), className: cnVal, logo: logo });
    onToast('학급 정보 저장 완료');
  };

  var addOne = function() {
    var name = newName.trim();
    if (!name) return;
    var maxN = students.length > 0 ? Math.max.apply(null, students.map(function(s){return s.number;})) : 0;
    onUpdateSt(students.concat([{ id: uid(), number: maxN+1, name: name }]));
    setNewName('');
    onToast(name + ' 학생 추가 완료');
  };

  var addBulkFn = function() {
    var names = bulk.split('\n').map(function(n){return n.trim();}).filter(function(n){return n.length>0;});
    if (!names.length) return;
    var maxN = students.length > 0 ? Math.max.apply(null, students.map(function(s){return s.number;})) : 0;
    var news = names.map(function(name, i) { return { id: uid(), number: maxN+1+i, name: name }; });
    onUpdateSt(students.concat(news));
    setBulk(''); setShowBulk(false);
    onToast(names.length + '명 학생 일괄 추가 완료');
  };

  var delStudent = function(id) {
    onUpdateSt(students.filter(function(s){return s.id !== id;}));
    onCleanupStudent(id);
    setDelConfirm(null); onToast('학생 삭제 완료 (관련 기록도 정리됨)');
  };

  var doCSVExport = function() {
    var allCats = [];
    Object.keys(MEMO_CATEGORIES).forEach(function(g){MEMO_CATEGORIES[g].forEach(function(c){allCats.push(c);});});
    var header = ['번호','이름','메모건수','상점합계','벌점합계'].concat(allCats);
    var rows = students.map(function(s){
      var sMemos = memos.filter(function(m){return m.studentId===s.id;});
      var sPoints = points.filter(function(p){return p.studentId===s.id;});
      var reward = sPoints.filter(function(p){return p.type==='reward';}).reduce(function(a,p){return a+p.points;},0);
      var penalty = sPoints.filter(function(p){return p.type==='penalty';}).reduce(function(a,p){return a+p.points;},0);
      var catCounts = {};
      allCats.forEach(function(c){catCounts[c]=0;});
      sMemos.forEach(function(m){if(m.categories){m.categories.forEach(function(c){if(catCounts[c]!==undefined)catCounts[c]++;});}});
      return [s.number,s.name,sMemos.length,reward,penalty].concat(allCats.map(function(c){return catCounts[c];}));
    });
    var bom = '\uFEFF';
    var csv = bom + header.join(',') + '\n' + rows.map(function(r){return r.join(',');}).join('\n');
    var blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='학급노트_통계_'+todayStr()+'.csv'; a.click();
    URL.revokeObjectURL(url);
    onToast('CSV 파일 다운로드 완료');
  };

  var doCSVImport = function(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = reader.result;
      var lines = text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
      if(lines.length<2){onToast('데이터가 없습니다','error');return;}
      var headerLine = lines[0].toLowerCase();
      var hasHeader = headerLine.includes('이름') || headerLine.includes('name') || headerLine.includes('번호');
      var startIdx = hasHeader ? 1 : 0;
      var maxN = students.length > 0 ? Math.max.apply(null,students.map(function(s){return s.number;})) : 0;
      var newStudents = [];
      for(var i=startIdx;i<lines.length;i++){
        var cols = lines[i].split(',').map(function(c){return c.trim().replace(/"/g,'');});
        var name = ''; var num = 0;
        if(cols.length>=2 && !isNaN(Number(cols[0]))){num=Number(cols[0]);name=cols[1];}
        else{name=cols[0];num=maxN+1+newStudents.length;}
        if(name) newStudents.push({id:uid(),number:num,name:name});
      }
      if(newStudents.length===0){onToast('학생을 찾을 수 없습니다','error');return;}
      onUpdateSt(students.concat(newStudents));

// ===== LockScreen =====
function LockScreen({ onUnlock }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  var press = function(n) {
    if(pin.length>=4) return;
    var next = pin + n;
    setPin(next);
    setError('');
    if(next.length===4){
      var saved = load(KEYS.pin,'');
      if(next===saved){ onUnlock(); }
      else{ setError('비밀번호가 일치하지 않습니다'); setTimeout(function(){setPin('');setError('');},1000); }
    }
  };
  var del = function(){ setPin(pin.slice(0,-1)); setError(''); };
  return html`<div className="lock-screen">
    <div className="lock-icon">🔒</div>
    <div className="lock-title">학급노트 잠금</div>
    <div className="lock-dots">
      ${[0,1,2,3].map(function(i){return html`<div key=${i} className=${'lock-dot'+(i<pin.length?' filled':'')}></div>`;})}
    </div>
    <div className="lock-numpad">
      ${[1,2,3,4,5,6,7,8,9].map(function(n){return html`<button key=${n} className="lock-num" onClick=${function(){press(String(n));}}>${n}</button>`;})}
      <div></div>
      <button className="lock-num" onClick=${function(){press('0');}}>0</button>
      <button className="lock-num lock-del" onClick=${del}>삭제</button>
    </div>
    <div className="lock-error">${error}</div>
  </div>`;
}

      ${showApprove ? html`<${ApproveFormModal}
        students=${students} classInfo=${ci} date=${date}
        onClose=${function(){setShowApprove(false);}} onToast=${toast} />` : null}

      ${showAbsence ? html`<${AbsenceFormModal}
        students=${students} classInfo=${ci} date=${date}
        onClose=${function(){setShowAbsence(false);}} onToast=${toast} />` : null}

      ${showSettings ? html`<${Settings}
        classInfo=${ci} students=${students} memos=${memos} points=${points}
        onUpdateCI=${setCi} onUpdateSt=${setStudents}
        onCleanupStudent=${function(id){ setMemos(function(p){return p.filter(function(m){return m.studentId!==id;});}); setPoints(function(p){return p.filter(function(x){return x.studentId!==id;});}); }}
        onResetData=${function(){ setMemos([]); setPoints([]); save(KEYS.memos,[]); save(KEYS.points,[]); }}
        onClose=${function(){setShowSettings(false);}} onToast=${toast} onReload=${reload} />` : null}

      ${showUpdate ? html`<div className="modal-overlay" onClick=${function(){setShowUpdate(false);save(KEYS.lastVer,APP_VERSION);}}>
        <div className="modal" style=${{maxHeight:'70vh',borderRadius:'20px 20px 0 0'}} onClick=${function(e){e.stopPropagation();}}>
          <div className="modal-header">
            <div className="modal-title">🎉 업데이트 안내</div>
            <button className="modal-close" onClick=${function(){setShowUpdate(false);save(KEYS.lastVer,APP_VERSION);}}>✕</button>
          </div>
          <div className="modal-body" style=${{padding:'20px'}}>
            <div style=${{fontSize:13,color:'var(--text-light)',marginBottom:16}}>Ver. ${APP_VERSION}</div>
            ${UPDATES.map(function(u){
              return html`<div key=${u.ver} style=${{marginBottom:12}}>
                ${u.items.map(function(item,i){
                  return html`<div key=${i} style=${{fontSize:14,lineHeight:1.7,color:'var(--text)'}}>${item}</div>`;
                })}
              </div>`;
            })}
            <button style=${{width:'100%',padding:'12px',border:'none',borderRadius:'var(--radius-sm)',background:'var(--primary)',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginTop:8}} onClick=${function(){setShowUpdate(false);save(KEYS.lastVer,APP_VERSION);}}>확인</button>
          </div>
        </div>
      </div>` : null}

      ${toasts.map(function(t){ return html`<div key=${t.id} className=${'toast ' + t.type}>${t.msg}</div>`; })}
    </div>
  `;
}

// ===== Mount =====
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
